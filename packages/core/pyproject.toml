# ---------------------------------------------------------------------------
# Core per-package config (packaging is handled by root pyproject.toml)
# ---------------------------------------------------------------------------
[project]
name = "codex-wise-core"
version = "0.1.2"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_wise"]

[tool.uv]
package = true
