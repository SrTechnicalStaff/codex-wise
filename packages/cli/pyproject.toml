# ---------------------------------------------------------------------------
# CLI per-package config (packaging is handled by root pyproject.toml)
# ---------------------------------------------------------------------------
[project]
name = "codex-wise-cli"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = ["codex-wise-core", "codex-wise-server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_wise"]

[tool.uv]
package = true

[tool.uv.sources]
codex-wise-core = { workspace = true }
codex-wise-server = { workspace = true }
